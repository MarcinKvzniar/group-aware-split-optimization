[project]
name = "optimization-methods-final-project"
version = "0.1.0"
description = "Metaheuristic optimization of group-aware stratified splitting for imbalanced hierarchical datasets"
authors = [
    { name = "Marcin Kuźniar" },
    { name = "Wojciech Pokrzywiec" },
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "pillow>=10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
